  - pytorch-cuda=11.8  # 12.1 for CUDA 12
  - pip:
    - numba==0.68.1
    - einops==0.8.2
    - pypose==0.7.5
    - kornia==0.8.2
    - numpy==1.26.4
    - plyfile==1.1.3
    - evo==1.38.1
    - opencv-python==4.11.0.86
    - yacs==0.1.8
    - scipy==1.17.1
